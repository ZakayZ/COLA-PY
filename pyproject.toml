[build-system]
requires = [
    "scikit-build-core>=0.5",
    "pybind11-global>=3.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "colapy"
version = "1.0.0"
description = "Python binding for COLA framework"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Artemii Novikov", email = "artyasen@yandex.ru" }
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
]
keywords = [
    "cpp",
    "bindings",
]
dependencies = [
    'click',
    'jinja2',
]
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "cibuildwheel",
]

[project.urls]
Repository = "https://github.com/ZakayZ/COLA-PY"

[project.scripts]
cola = "colapy.cli:main"

[dependency-groups]
test = [
    "pytest",
]
dev = [
    {include-group = "test"},
    "ruff",
    "cibuildwheel",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.source-dir = "."

sdist.include = [
    "src/**/*",
    "cmake/**/*", 
    "data/**/*",
    "tests/**/*",
    "CMakeLists.txt",
    "pyproject.toml",
    "README.md",
    "LICENSE",
    # "*.cpp", "*.h", "*.hh", "*.hpp",
    # "*.cmake", "*.in",
]

sdist.exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
    "**/*.so",
    "**/*.dll", 
    "**/*.dylib",
    "build/**",
    "dist/**",
    "**/*.egg-info/**",
]

[tool.cibuildwheel]
build-frontend = "build"
enable = ["pypy"]
test-command = "python -m pytest tests"
test-sources = ["pyproject.toml", "tests"]
test-groups = ["test"]
test-skip = "*-pp*"

[tool.ruff]
line-length = 120
target-version = "py38"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py

[tool.ruff.isort]
known-first-party = ["colapy"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
